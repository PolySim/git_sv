[package]
name = "git_sv"
version = "0.4.0"
edition = "2021"
description = "Visualize git graph in your terminal"
license = "MIT"
homepage = "https://github.com/PolySim/git_sv"
repository = "https://github.com/PolySim/git_sv"
readme = "README.md"
keywords = ["git", "tui", "terminal", "graph", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git_sv"
path = "src/main.rs"

[features]
default = []
vendored-ssl = ["git2/vendored-openssl"]
profiling = []

[dependencies]
ratatui = "0.29"
ratatui-image = "5"
crossterm = "0.28"
git2 = { version = "0.19", default-features = false, features = ["https", "ssh"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
dirs = "5"
arboard = { version = "3", default-features = false }
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
resvg = { version = "0.45", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1.34", features = ["yaml"] }

[package.metadata.tarpaulin]
timeout = "300"
out = ["Html", "Json"]
output-dir = "coverage"
exclude-files = ["tests/*", "src/main.rs"]

[profile.release]
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
